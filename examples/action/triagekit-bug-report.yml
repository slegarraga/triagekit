name: "Acme Action bug report"
description: "Report a reproducible problem in Acme Action."
title: "[bug]: "
labels: ["bug", "github-action", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Acme Action. Please fill out the sections below so maintainers can reproduce the issue quickly."
  - type: textarea
    id: summary
    attributes:
      label: "What happened?"
      description: "A short description of the bug and the impact."
      placeholder: "When I run ... I expected ... but ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "How can we reproduce it?"
      description: "List the smallest set of steps a maintainer can follow."
      placeholder: "1. Install ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
      placeholder: "Expected ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "GitHub runner image, workflow snippet, action version, and related secrets/config"
      placeholder: "GitHub runner image, workflow snippet, action version, and related secrets/config"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched existing issues and did not find a duplicate."
        - label: "I can still reproduce this on the latest Acme Action version."
        - label: "I included enough detail for a maintainer to verify the issue."
    validations:
      required: true
